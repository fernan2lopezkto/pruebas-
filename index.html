<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-g">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro Piloto Youtube</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-base-200">
    <main class="container mx-auto p-4">
        <h1 class="text-4xl font-bold text-center mb-8">Videos de Interés</h1>

        <div id="video-player" class="video-player-container mb-8 bg-base-300 rounded-lg">
            <p class="text-center p-10">Seleccioná un video de la lista para verlo aquí, bo.</p>
        </div>

        <div class="filtros-container mb-8 flex flex-wrap gap-2 justify-center">
            <button class="btn btn-primary" data-filtro="todos">Todos</button>
            <button class="btn btn-outline" data-filtro="estudio">Estudio</button>
            <button class="btn btn-outline" data-filtro="reflexion">Reflexión</button>
            <button class="btn btn-outline" data-filtro="musica">Música</button>
        </div>

        <div class="videos-container grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
