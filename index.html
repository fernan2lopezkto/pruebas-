<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Descargar Redes Sociales">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png">
  <title>Descargar de Redes Sociales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">Descargar Contenidos de Redes Sociales</h1>
    <div class="accordion" id="accordionExample">
      <!-- Sección: Descargar Reels -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingReels">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseReels" aria-expanded="true" aria-controls="collapseReels">
            Descargar Reels de Instagram
          </button>
        </h2>
        <div id="collapseReels" class="accordion-collapse collapse show" aria-labelledby="headingReels" data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <input type="text" id="reelUrl" class="form-control mb-3" placeholder="https://www.instagram.com/reel/...">
            <button onclick="getReelData()" class="btn btn-primary w-100">Descargar Reel</button>
            <div id="reelLoading" class="mt-3 text-black d-none">Cargando...</div>
            <div id="reelVideoContainer" class="mt-3 d-none">
              <img id="reelThumbnail" src="" alt="Thumbnail" class="img-thumbnail mb-2">
              <p id="reelVideoQuality" class="text-black"></p>
              <a id="reelDownloadLink" href="#" target="_blank" class="btn btn-success">Descargar Video</a>
            </div>
            <p id="reelError" class="mt-3 text-danger d-none">Algo salió mal. Intenta nuevamente.</p>
          </div>
        </div>
      </div>

      <!-- Sección: Descargar Estados -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingEstados">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseEstados" aria-expanded="false" aria-controls="collapseEstados">
            Descargar Estados de Instagram
          </button>
        </h2>
        <div id="collapseEstados" class="accordion-collapse collapse" aria-labelledby="headingEstados" data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <input type="text" id="statusUrl" class="form-control mb-3" placeholder="https://www.instagram.com/stories/...">
            <button onclick="getStatusData()" class="btn btn-secondary w-100">Descargar Estado</button>
            <div id="statusLoading" class="mt-3 text-black d-none">Cargando...</div>
            <div id="statusVideoContainer" class="mt-3 d-none">
              <img id="statusThumbnail" src="" alt="Thumbnail" class="img-thumbnail mb-2">
              <p id="statusVideoQuality" class="text-black"></p>
              <a id="statusDownloadLink" href="#" target="_blank" class="btn btn-success">Descargar Video</a>
            </div>
            <p id="statusError" class="mt-3 text-danger d-none">Algo salió mal. Intenta nuevamente.</p>
          </div>
        </div>
      </div>

      <!-- Sección: Descargar Shorts -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingShorts">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseShorts" aria-expanded="false" aria-controls="collapseShorts">
            Descargar Shorts de YouTube
          </button>
        </h2>
        <div id="collapseShorts" class="accordion-collapse collapse" aria-labelledby="headingShorts" data-bs-parent="#accordionExample">
          <div class="accordion-body">
            <input type="text" id="shortUrl" class="form-control mb-3" placeholder="https://youtube.com/shorts/...">
            <button onclick="getShortData()" class="btn btn-danger w-100">Descargar Short</button>
            <div id="shortLoading" class="mt-3 text-black d-none">Cargando...</div>
            <div id="shortVideoContainer" class="mt-3 d-none">
              <img id="shortThumbnail" src="" alt="Thumbnail" class="img-thumbnail mb-2">
              <p id="shortVideoQuality" class="text-black"></p>
              <a id="shortDownloadLink" href="#" target="_blank" class="btn btn-success">Descargar Video</a>
            </div>
            <p id="shortError" class="mt-3 text-danger d-none">Algo salió mal. Intenta nuevamente.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Botón de instalación -->
    <div class="text-center mt-4">
      <button onclick="installApp()" id="installButton" class="btn btn-info">Agregar a la pantalla de inicio</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 
  <script>
    // Variables para el botón de instalación
    let deferredPrompt;
    const installButton = document.getElementById('installButton');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installButton.style.display = 'block';
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(choiceResult => {
          if (choiceResult.outcome === 'accepted') {
            console.log('Instalación aceptada');
          }
          deferredPrompt = null;
        });
      }
    }

    // Descargar Reel
    async function getReelData() {
      await fetchData('reelUrl', 'reel');
    }

    // Descargar Estado
    async function getStatusData() {
      await fetchData('statusUrl', 'status');
    }

    // Descargar Short
    async function getShortData() {
      await fetchData('shortUrl', 'short');
    }

    // Función genérica para descarga
    async function fetchData(inputId, prefix) {
      const videoUrl = document.getElementById(inputId).value;
      const loading = document.getElementById(`${prefix}Loading`);
      const videoContainer = document.getElementById(`${prefix}VideoContainer`);
      const thumbnail = document.getElementById(`${prefix}Thumbnail`);
      const videoQuality = document.getElementById(`${prefix}VideoQuality`);
      const downloadLink = document.getElementById(`${prefix}DownloadLink`);
      const error = document.getElementById(`${prefix}Error`);

      try {
        loading.classList.remove('d-none');
        videoContainer.classList.add('d-none');
        error.classList.add('d-none');

        const response = await fetch('https://social-media-video-downloader.p.rapidapi.com/smvd/get/all?url=' + encodeURIComponent(videoUrl), {
          method: 'GET',
          headers: {
            'X-RapidAPI-Key': 'd6eefda435msh8ae60d04d6b9b22p172e56jsn5a84a74c03bd',
            'X-RapidAPI-Host': 'social-media-video-downloader.p.rapidapi.com'
          }
        });

        if (!response.ok) throw new Error(`Error ${response.status}: ${response.statusText}`);

        const data = await response.json();
        thumbnail.src = data.picture;
        videoQuality.textContent = data.links[1].quality;
        downloadLink.href = data.links[1].link;
        downloadLink.download = `${prefix}_${Date.now()}.mp4`;

        videoContainer.classList.remove('d-none');
        loading.classList.add('d-none');
      } catch (err) {
        error.textContent = `Error: ${err.message}`;
        error.classList.remove('d-none');
        loading.classList.add('d-none');
      }
    }
  </script>
</body>
</html>
