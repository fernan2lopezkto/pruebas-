<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar Reels de Instagram</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h1 class="mb-4">Descargar Reels de Instagram</h1>
            <p class="mb-4">Pega el enlace del reel de Instagram a continuación:</p>
            <input type="text" id="reelUrl" class="form-control mb-3" placeholder="https://www.instagram.com/reel/...">
            <button onclick="getApidata()" class="btn btn-primary w-100">Descargar</button>
            <div id="loading" class="mt-3 text-black d-none">Cargando...</div>
            <div id="videoContainer" class="mt-3 d-none">
              <img id="thumbnail" src="" alt="Thumbnail" class="img-thumbnail mb-2">
              <p id="videoQuality" class="text-black"></p>
              <a id="downloadLink" href="#" target="_blank" class="btn btn-success">Descargar Video</a>
            </div>
            <p id="error" class="mt-3 text-danger d-none">Algo salió mal. Intenta nuevamente.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    async function getApidata() {
      const videoUrl = document.getElementById('reelUrl').value;
      const loading = document.getElementById('loading');
      const videoContainer = document.getElementById('videoContainer');
      const thumbnail = document.getElementById('thumbnail');
      const videoQuality = document.getElementById('videoQuality');
      const downloadLink = document.getElementById('downloadLink');
      const error = document.getElementById('error');

      try {
  loading.classList.remove('d-none');
  videoContainer.classList.add('d-none');
  error.classList.add('d-none');

  const response = await fetch('https://social-media-video-downloader.p.rapidapi.com/smvd/get/all?url=' + encodeURIComponent(videoUrl) + '&filename=download', {
    method: 'GET',
    headers: {
      'X-RapidAPI-Key': 'd6eefda435msh8ae60d04d6b9b22p172e56jsn5a84a74c03bd',
      'X-RapidAPI-Host': 'social-media-video-downloader.p.rapidapi.com'
    }
  });

  if (!response.ok) {
    throw new Error(`Error ${response.status}: ${response.statusText}`);
  }

  const data = await response.json();
  thumbnail.src = data.picture;
  videoQuality.textContent = data.links[1].quality;
  downloadLink.href = data.links[1].link;

  videoContainer.classList.remove('d-none');
  loading.classList.add('d-none');
} catch (err) {
  console.error('Error:', err.message);
  error.textContent = `Error: ${err.message}`;
  error.classList.remove('d-none');
  loading.classList.add('d-none');
}

    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
