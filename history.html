<!DOCTYPE html>
<html lang="es" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Ponderado</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script> 
    
    <style>
        .video-player-wrapper { position: relative; padding-top: 56.25%; height: 0; overflow: hidden; background-color: #000; }
        .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .id-text { font-size: 12px; color: #777; opacity: 0.7; }
        .history-card { cursor: pointer; }
        @media (max-width: 600px) { body { padding-bottom: 5rem; } }
    </style>
</head>
<body class="bg-base-200 min-h-screen pb-20 lg:pb-0 lg:pt-4">

    <header class="p-4 bg-base-100 shadow-md">
        <div class="container mx-auto max-w-4xl flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary">Historial (Importancia)</h1>
            <nav class="space-x-4">
                <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
                <a href="history.html" class="btn btn-primary btn-sm">Historial</a>
                <a href="config.html" class="btn btn-ghost btn-sm">Config</a>
            </nav>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-4xl">
        
        <h2 class="text-xl font-semibold mb-4 mt-4">Videos Vistos (Máx 50)</h2>
        <p class="text-sm mb-4 opacity-80">Ordenados por Importancia (clic para +1 punto y reproducir).</p>

        <div id="history-list" class="grid grid-cols-1 gap-6">
            <div class="alert alert-info text-center">
                <span>Cargando historial...</span>
            </div>
        </div>

    </div>
    
    <div class="btm-nav lg:hidden z-50 bg-base-100 shadow-xl rounded-t-2xl">
        <a href="index.html" class="p-3" aria-label="Ir a Home">
            <i data-lucide="home" class="w-6 h-6"></i>
        </a>
        <a href="history.html" class="active p-3" aria-label="Ir a Historial">
            <i data-lucide="history" class="w-6 h-6"></i>
        </a>
        <a href="config.html" class="p-3" aria-label="Ir a Configuración">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </a>
    </div>
    
    <script type="module">
        // Importación de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, limit, getDocs, updateDoc, increment, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Variables globales del entorno
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUserId = null;
        const HISTORY_COLLECTION_PATH = `/artifacts/${appId}/users/`;
        const MAX_HISTORY_ITEMS = 50;

        // --- Funciones Compartidas (Mínimas para este archivo) ---
        
        async function setupAuth() {
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
            } else if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                    currentUserId = auth.currentUser.uid;
                } catch (error) {
                    await signInAnonymously(auth);
                    currentUserId = auth.currentUser.uid;
                }
            } else {
                await signInAnonymously(auth);
                currentUserId = auth.currentUser.uid;
            }
            return currentUserId;
        }

        async function updateHistoryImportance(videoId, title, snippet, delta) {
            await setupAuth();
            if (!currentUserId) return;

            const docRef = doc(db, HISTORY_COLLECTION_PATH + currentUserId + "/history", videoId);
            
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                await updateDoc(docRef, {
                    importance: increment(delta),
                    timestamp: Date.now(),
                });
            } else {
                const newVideo = {
                    videoId: videoId,
                    title: title,
                    snippet: snippet,
                    importance: delta,
                    timestamp: Date.now(),
                };
                await setDoc(docRef, newVideo);
            }
        }

        // --- Lógica Específica del HISTORIAL ---
        
        async function deleteVideo(videoId) {
            await setupAuth();
            if (!currentUserId) return;
            try {
                const docRef = doc(db, HISTORY_COLLECTION_PATH + currentUserId + "/history", videoId);
                await deleteDoc(docRef);
                console.log(`Video ${videoId} eliminado.`);
                // onSnapshot se encargará de re-renderizar
            } catch (e) {
                console.error("Error removing document: ", e);
                alert("Error al eliminar el video. Ver consola para más detalles.");
            }
        }
        
        function createHistoryElement(video) {
            const videoId = video.videoId;
            const videoTitle = video.title;
            const thumbnailUrl = video.snippet?.thumbnails?.medium?.url;
            const importance = video.importance || 0;

            const videoElement = document.createElement('div');
            videoElement.className = 'card bg-base-100 shadow-md history-card flex-row p-4 items-center';
            
            // Thumbnail (clickable part)
            const thumbnailDiv = document.createElement('div');
            thumbnailDiv.className = 'flex-shrink-0 w-24 h-16 mr-4 bg-cover bg-center rounded-lg';
            thumbnailDiv.style.backgroundImage = `url('${thumbnailUrl}')`;
            thumbnailDiv.onclick = () => handleHistoryClick(videoId, videoTitle, video.snippet);
            videoElement.appendChild(thumbnailDiv);

            // Body
            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'flex-grow';
            bodyDiv.innerHTML = `
                <h3 class="font-bold mb-1 text-sm overflow-hidden whitespace-nowrap overflow-ellipsis" 
                    title="${videoTitle}"
                    onclick="handleHistoryClick('${videoId}', '${videoTitle}', {})">
                    ${videoTitle}
                </h3>
                <p class="text-xs opacity-70 mb-1">Importancia: <span class="badge badge-primary">${importance}</span></p>
                <p class="id-text">ID: ${videoId}</p>
            `;
            
            // Botón de Eliminar
            const deleteButton = document.createElement('button');
            deleteButton.className = 'btn btn-error btn-sm btn-circle ml-4 flex-shrink-0';
            deleteButton.innerHTML = `<i data-lucide="trash-2" class="w-4 h-4"></i>`;
            deleteButton.onclick = (e) => {
                e.stopPropagation(); // Evita que se dispare el handleHistoryClick
                // Usamos un modal simple para confirmación (reemplaza alert/confirm)
                if (window.confirm(`¿Seguro que quieres eliminar "${videoTitle}" del historial?`)) {
                    deleteVideo(videoId);
                }
            };
            
            videoElement.appendChild(bodyDiv);
            videoElement.appendChild(deleteButton);

            return videoElement;
        }

        window.handleHistoryClick = async (videoId, title, snippet) => {
            // 1. +1 punto de importancia
            await updateHistoryImportance(videoId, title, snippet, 1);
            
            // 2. Redirigir a la página de reproducción y le pide que haga la búsqueda por título
            window.location.href = `play.html?v=${videoId}&title=${encodeURIComponent(title)}`;
        };


        async function startHistoryListener() {
            await setupAuth();
            if (!currentUserId) {
                 document.getElementById('history-list').innerHTML = `<div class="alert alert-error text-center"><span>Error de autenticación. No se pudo cargar el historial.</span></div>`;
                 return;
            }

            const historyRef = collection(db, HISTORY_COLLECTION_PATH + currentUserId + "/history");
            
            // Usaremos una consulta simple y luego ordenamos en memoria para evitar errores de índice en Firestore
            const q = query(historyRef, limit(MAX_HISTORY_ITEMS));
            
            onSnapshot(q, (snapshot) => {
                let videos = [];
                snapshot.forEach(doc => {
                    videos.push(doc.data());
                });

                // Ordenar por importancia (descendente) y luego por timestamp (más reciente primero)
                videos.sort((a, b) => {
                    if (b.importance !== a.importance) {
                        return b.importance - a.importance;
                    }
                    return b.timestamp - a.timestamp;
                });
                
                // Asegurar el límite de 50
                videos = videos.slice(0, MAX_HISTORY_ITEMS); 

                const listDiv = document.getElementById('history-list');
                listDiv.innerHTML = '';
                
                if (videos.length === 0) {
                    listDiv.innerHTML = `<div class="alert alert-info text-center"><span>Tu historial está vacío.</span></div>`;
                    return;
                }

                videos.forEach(video => {
                    listDiv.appendChild(createHistoryElement(video));
                });
                
                // Renderizar los íconos de Lucide nuevamente
                lucide.createIcons();
            }, (error) => {
                console.error("Error fetching history:", error);
                document.getElementById('history-list').innerHTML = `<div class="alert alert-error text-center"><span>Error al cargar el historial. Intenta recargar la página.</span></div>`;
            });
        }
        
        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            startHistoryListener();
        });
    </script>
</body>
</html>
