<!DOCTYPE html>
<html lang="es" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play - Reproducción</title>
    
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script> 
    
    <style>
        /* Video Player Styles */
        .video-container { margin-bottom: 1.5rem; }
        .video-player-wrapper { position: relative; padding-top: 56.25%; height: 0; overflow: hidden; background-color: #000; }
        .video-player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .id-text { font-size: 12px; color: #777; opacity: 0.7; }

        /* Search Result Video Overlay (Only on search results, not the main player) */
        .search-result .video-overlay { 
            z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            background-color: rgba(0,0,0,0.5); transition: background-color 0.3s;
        }
        .search-result .video-overlay:hover { background-color: rgba(0,0,0,0.3); }
        .search-result .video-overlay svg { color: white; width: 3rem; height: 3rem; opacity: 0.9; }

        /* Estilo para el reproductor principal fijo */
        #main-player-card {
            position: sticky;
            top: 0;
            z-index: 20;
            margin-bottom: 1.5rem;
        }
        @media (max-width: 600px) { body { padding-bottom: 5rem; } }
    </style>
</head>
<body class="bg-base-200 min-h-screen pb-20 lg:pb-0 lg:pt-4">

    <header class="p-4 bg-base-100 shadow-md">
        <div class="container mx-auto max-w-4xl flex justify-between items-center">
            <h1 class="text-2xl font-bold text-primary">Reproductor</h1>
            <nav class="space-x-4">
                <a href="index.html" class="btn btn-ghost btn-sm">Home</a>
                <a href="history.html" class="btn btn-ghost btn-sm">Historial</a>
                <a href="config.html" class="btn btn-ghost btn-sm">Config</a>
            </nav>
        </div>
    </header>

    <div class="container mx-auto p-4 max-w-4xl">
        
        <div id="main-player-card" class="card bg-base-100 shadow-xl p-4">
            <h2 id="main-video-title" class="text-xl font-bold mb-2">Cargando Video...</h2>
            <div id="main-player-area" class="video-player-wrapper bg-gray-700 rounded-lg">
                <div class="absolute inset-0 flex items-center justify-center text-white">Cargando...</div>
            </div>
            <p id="main-video-info" class="text-sm mt-2 opacity-70"></p>
        </div>

        <h2 id="related-title" class="text-xl font-semibold mb-4 mt-6">Videos Relacionados</h2>
        <div id="related-videos-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="col-span-1 md:col-span-2 alert alert-info text-center">
                <span>Buscando resultados relacionados...</span>
            </div>
        </div>

    </div>
    
    <div class="btm-nav lg:hidden z-50 bg-base-100 shadow-xl rounded-t-2xl">
        <a href="index.html" class="p-3" aria-label="Ir a Home">
            <i data-lucide="home" class="w-6 h-6"></i>
        </a>
        <a href="history.html" class="p-3" aria-label="Ir a Historial">
            <i data-lucide="history" class="w-6 h-6"></i>
        </a>
        <a href="config.html" class="p-3" aria-label="Ir a Configuración">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </a>
    </div>
    
    <script type="module">
        // Importación de Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, limit, where, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Variables globales del entorno
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let currentUserId = null;
        let API_KEY = '';
        const BASE_URL = 'https://www.googleapis.com/youtube/v3/search';
        const HISTORY_COLLECTION_PATH = `/artifacts/${appId}/users/`;
        const CONFIG_DOC_PATH = `/artifacts/${appId}/users/`;

        // --- Funciones Compartidas (Mínimas para este archivo) ---
        
        async function setupAuth() {
            if (auth.currentUser) {
                currentUserId = auth.currentUser.uid;
            } else if (initialAuthToken) {
                try {
                    await signInWithCustomToken(auth, initialAuthToken);
                    currentUserId = auth.currentUser.uid;
                } catch (error) {
                    await signInAnonymously(auth);
                    currentUserId = auth.currentUser.uid;
                }
            } else {
                await signInAnonymously(auth);
                currentUserId = auth.currentUser.uid;
            }
            return currentUserId;
        }

        async function loadConfig() {
            await setupAuth();
            if (!currentUserId) return;
            const docRef = doc(db, CONFIG_DOC_PATH + currentUserId, "config");
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    API_KEY = docSnap.data().apiKey || '';
                    return { apiKey: API_KEY, keywords: docSnap.data().keywords || '' };
                }
            } catch (e) {
                console.error("Error loading config:", e);
            }
            return { apiKey: '', keywords: '' };
        }

        async function fetchVideoDetails(videoId) {
            const config = await loadConfig();
            if (!config.apiKey) return null;

            const params = new URLSearchParams({
                part: 'snippet',
                id: videoId,
                key: config.apiKey,
            });

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/videos?${params.toString()}`);
                const data = await response.json();
                return data.items && data.items.length > 0 ? data.items[0] : null;
            } catch (error) {
                console.error('Fetch Details Error:', error);
                return null;
            }
        }

        async function updateHistoryImportance(videoId, title, snippet, delta) {
            await setupAuth();
            if (!currentUserId) return;

            const docRef = doc(db, HISTORY_COLLECTION_PATH + currentUserId + "/history", videoId);
            
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                await updateDoc(docRef, {
                    importance: increment(delta),
                    timestamp: Date.now(),
                });
            } else {
                const newVideo = {
                    videoId: videoId,
                    title: title,
                    snippet: snippet,
                    importance: delta,
                    timestamp: Date.now(),
                };
                await setDoc(docRef, newVideo);
            }
        }
        
        // --- Lógica Específica del PLAY ---
        
        function getUrlParams() {
            const params = {};
            new URLSearchParams(window.location.search).forEach((value, key) => {
                params[key] = value;
            });
            return params;
        }
        
        function renderMainPlayer(videoId, title, channelTitle) {
            document.getElementById('main-video-title').textContent = title;
            document.getElementById('main-video-info').textContent = `Canal: ${channelTitle} | ID: ${videoId}`;

            const playerArea = document.getElementById('main-player-area');
            const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&modestbranding=1`;
            
            playerArea.innerHTML = `
                <iframe class="video-player" src="${embedUrl}" 
                    frameborder="0" allow="autoplay; fullscreen" allowfullscreen 
                    title="${title}">
                </iframe>
            `;
        }

        function createResultVideoElement(video) {
            const videoId = video.id.videoId;
            const videoTitle = video.snippet.title;
            const videoElement = document.createElement('div');
            videoElement.className = 'card card-compact bg-base-100 shadow-lg search-result';
            
            const thumbnailUrl = video.snippet.thumbnails.medium.url;
            
            videoElement.innerHTML = `
                <div class="video-player-wrapper bg-cover bg-center" style="background-image: url('${thumbnailUrl}')">
                    <button class="video-overlay" 
                            data-video-id="${videoId}" data-title="${videoTitle}"
                            data-channel-title="${video.snippet.channelTitle}"
                            onclick="handleRelatedVideoClick(event)">
                        <i data-lucide="play-circle" class="w-6 h-6 text-white"></i>
                    </button>
                </div>
                <div class="card-body">
                    <h3 class="card-title text-base">${videoTitle}</h3>
                    <p class="text-sm">Canal: ${video.snippet.channelTitle}</p>
                    <p class="id-text">ID: ${videoId}</p>
                </div>
            `;
            // Almacenamos el snippet completo para el historial
            videoElement.videoData = video; 
            return videoElement;
        }

        async function fetchVideos(query, maxResults = 10) {
            const config = await loadConfig();
            if (!config.apiKey) {
                 document.getElementById('related-videos-list').innerHTML = `<div class="col-span-1 md:col-span-2 alert alert-error"><span>❌ Por favor, configura tu Clave de API en la página de Configuración.</span></div>`;
                return [];
            }
            
            const params = new URLSearchParams({
                part: 'snippet',
                q: query,
                key: config.apiKey,
                type: 'video', 
                maxResults: maxResults,
                videoEmbeddable: 'true',
                safeSearch: 'strict'
            });

            try {
                const response = await fetch(`${BASE_URL}?${params.toString()}`);
                const data = await response.json();
                return data.items || [];
            } catch (error) {
                document.getElementById('related-videos-list').innerHTML = `<div class="col-span-1 md:col-span-2 alert alert-error"><span>Error de red al buscar videos.</span></div>`;
                return [];
            }
        }
        
        async function loadAndPlayVideo() {
            const params = getUrlParams();
            let videoId = params.v;
            let query = params.q || '';
            let title = params.title || '';

            if (!videoId) {
                document.getElementById('main-video-title').textContent = "No se seleccionó ningún video.";
                return;
            }

            let videoDetails = await fetchVideoDetails(videoId);

            if (videoDetails) {
                const videoTitle = videoDetails.snippet.title;
                const channelTitle = videoDetails.snippet.channelTitle;
                
                renderMainPlayer(videoId, videoTitle, channelTitle);
                
                // Si la búsqueda original no fue definida (ej. viene del historial),
                // usamos el título del video como nueva consulta para videos relacionados.
                const searchQuery = query || videoTitle; 
                document.getElementById('related-title').textContent = `Videos Relacionados con: ${searchQuery}`;
                
                // Buscar resultados
                const relatedVideos = await fetchVideos(searchQuery, 10);
                const listDiv = document.getElementById('related-videos-list');
                listDiv.innerHTML = '';

                if (relatedVideos.length > 0) {
                    relatedVideos.forEach(video => {
                        // Excluimos el video principal si aparece en los resultados
                        if (video.id.videoId !== videoId) {
                            const element = createResultVideoElement(video);
                            element.videoData = video;
                            listDiv.appendChild(element);
                        }
                    });
                } else {
                    listDiv.innerHTML = `<div class="col-span-1 md:col-span-2 alert alert-warning text-center"><span>No se encontraron videos relacionados.</span></div>`;
                }

            } else {
                 document.getElementById('main-video-title').textContent = "Error al cargar detalles del video.";
            }
            lucide.createIcons(); // Vuelve a renderizar íconos
        }
        
        window.handleRelatedVideoClick = async (event) => {
            const button = event.currentTarget;
            const newVideoId = button.getAttribute('data-video-id');
            const newVideoTitle = button.getAttribute('data-title');
            const newChannelTitle = button.getAttribute('data-channel-title');
            
            const card = button.closest('.card');
            const videoData = card.videoData || {}; 

            // 1. Actualiza el reproductor principal (Queda fijo arriba)
            renderMainPlayer(newVideoId, newVideoTitle, newChannelTitle);

            // 2. Guarda el nuevo video en el historial (sin incremento adicional aquí)
            await updateHistoryImportance(newVideoId, newVideoTitle, videoData.snippet, 0); // No suma importancia, solo lo registra/actualiza

            // 3. Vuelve a buscar relacionados usando el título del nuevo video
            const searchQuery = newVideoTitle; 
            document.getElementById('related-title').textContent = `Videos Relacionados con: ${searchQuery}`;
            
            const relatedVideos = await fetchVideos(searchQuery, 10);
            const listDiv = document.getElementById('related-videos-list');
            listDiv.innerHTML = '';

            if (relatedVideos.length > 0) {
                relatedVideos.forEach(video => {
                    if (video.id.videoId !== newVideoId) {
                        const element = createResultVideoElement(video);
                        element.videoData = video;
                        listDiv.appendChild(element);
                    }
                });
            } else {
                listDiv.innerHTML = `<div class="col-span-1 md:col-span-2 alert alert-warning text-center"><span>No se encontraron videos relacionados.</span></div>`;
            }
            
            lucide.createIcons(); // Vuelve a renderizar íconos
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Vuelve al inicio para ver el video
        };


        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadAndPlayVideo();
        });
    </script>
</body>
  </html>
